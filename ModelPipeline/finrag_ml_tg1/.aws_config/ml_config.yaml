# ============================================================================
# FinRAG ML Pipeline - Path Configuration
# Purpose: S3 paths for data inputs/outputs
# ============================================================================

# AWS S3 Bucket Configuration
s3:
  bucket_name: sentence-data-ingestion-mjs
  region: us-east-1
  base_path_etl: DATA_MERGE_ASSETS
  base_path_ml: ML_EMBED_ASSETS

# ============================================================================
# DATA PATHS - ETL LAYER (Reference/Input)
# ============================================================================
data_etl:
  # Historical fact table (base dataset)
  historical:
    path: DATA_MERGE_ASSETS/HISTORICAL_DATA
    filename: finrag_sec_fact_historical.parquet
    description: "Base historical dataset from DuckDB export"
  
  # Incremental staging data (new/updated rows)
  crawled_incremental_stg:
    path: DATA_MERGE_ASSETS/INCREMENTAL_DATA
    filename: finrag_sec_incremental_stg_data.parquet
    description: "New data from API ingestion pipeline"

  # Final merged fact table (Stage 1 - Input for ML)
  sentence_fact:
    path: DATA_MERGE_ASSETS/FINRAG_FACT_SENTENCES
    filename: finrag_fact_sentences.parquet
    description: "Stage 1 - Original ETL output (24 columns)"
    compression: zstd

# ============================================================================
# DATA PATHS - ML LAYER (Output)
# ============================================================================
data_ml:
  # Enhanced fact table with embedding metadata
  meta_embeds:
    path: ML_EMBED_ASSETS/EMBED_META_FACT
    filename: finrag_fact_sentences_meta_embeds.parquet
    description: "Stage 2 - With embedding metadata + RAG helpers (35 columns)"
    compression: zstd

  
  # S3 Vectors staging (Stage 3 - Ready for ingestion)
  s3_vectors_staging:
    base_path: ML_EMBED_ASSETS/S3_VECTORS_STAGING  # for consistency
    
    cohere_1024d:
      path: ML_EMBED_ASSETS/S3_VECTORS_STAGING/cohere_1024d
      filename: finrag_embeddings_s3vectors_cohere_1024d.parquet
      dimensions: 1024
      description: "Stage 3 - Cohere 1024d vectors prepared for S3 Vectors"
      compression: zstd
    
    titan_1024d:
      path: ML_EMBED_ASSETS/S3_VECTORS_STAGING/titan_1024d
      filename: finrag_embeddings_s3vectors_titan_1024d.parquet
      dimensions: 1024
      description: "Stage 3 - Titan 1024d vectors prepared for S3 Vectors"
      compression: zstd

  
  # Embeddings: Separate storage per provider
  embeddings:
    base_path: ML_EMBED_ASSETS/EMBED_VECTORS

    # THE ONE AND ONLY VECTORS TABLE. Every vector ever generated for this
    # project lives in the cohere_1024d slot. Verified 2026-07-29: no other
    # slot has ever held data.
    # This exists to kill a latent P0: ml_config_loader.embeddings_path() used
    # to fall back to a hardcoded 'cohere_768d' for any non-bedrock provider.
    # Flipping the transport would have silently resolved the 768-d path,
    # found nothing, and seeded a FRESH table -- orphaning all vectors with no
    # error and no warning. The fallback now reads this key instead.
    # The 768d / titan slots below are retained for schema compatibility only
    # and are NEVER written to.
    canonical_slot: cohere_1024d

    cohere_768d:
      path: ML_EMBED_ASSETS/EMBED_VECTORS/cohere_768d
      filename: finrag_embeddings_cohere_768d.parquet
      metadata_file: embedding_metadata.json
      dimensions: 768
    
    cohere_1024d:  
      path: ML_EMBED_ASSETS/EMBED_VECTORS/cohere_1024d
      filename: finrag_embeddings_cohere_1024d.parquet
      metadata_file: embedding_metadata.json
      dimensions: 1024

    titan_1024d:
      path: ML_EMBED_ASSETS/EMBED_VECTORS/titan_1024d
      filename: finrag_embeddings_titan_1024d.parquet
      metadata_file: embedding_metadata.json
      dimensions: 1024


  ## DATA_MERGE_ASSETS/DIMENSION_TABLES/finrag_dim_companies_21.parquet
  ## DATA_MERGE_ASSETS/DIMENSION_TABLES/finrag_dim_sec_sections.parquet
  # Dimension tables
  dimensions:
    path: DATA_MERGE_ASSETS/DIMENSION_TABLES
    companies:
      filename: finrag_dim_companies_25.parquet
      description: "25 curated companies with CIK, ticker, name"
    sections:
      filename: finrag_dim_sec_sections.parquet
      description: "SEC 10-K section taxonomy (20 sections)"

  # KPI Fact Table (Metric Pipeline)
  kpi_facts:
    path: DATA_MERGE_ASSETS/FINRAG_FACT_METRICS
    filename: KPI_FACT_DATA_EDGAR.parquet
    description: "Structured KPI extraction from 10-K filings"

  # Query Logs & Exports (QueryLogger persistence)
  query_logging:
    base_path: DATA_MERGE_ASSETS/LOGS/FINRAG
    logs:
      path: DATA_MERGE_ASSETS/LOGS/FINRAG/logs
      description: "Query execution logs (metadata, cost, performance)"
    contexts:
      path: DATA_MERGE_ASSETS/LOGS/FINRAG/contexts
      description: "Assembled contexts sent to LLM"
    responses:
      path: DATA_MERGE_ASSETS/LOGS/FINRAG/responses
      description: "Full query responses with metadata"

      
# ============================================================================
# EMBEDDING CONFIGURATION
# ============================================================================


  # Total sentences without embeddings: 266,176
  # Distinct companies: 21
  # Distinct years: 20
  
  # filters:
  #   cik_int: [34088, 59478, 104169, 200406, 320193, 789019, 813762, 814585, 890926, 909832, 1018724, 1045810, 1065280, 1141391, 1273813, 1276520, 1318605, 1326801, 1341439, 1403161, 1652044]
  #   year: [2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  #   sections: null

  #   Batch Suggestions (5 companies per batch):
  # cik_int: [ 34088, 59478, 104169, 200406, 320193 ] 
  # cik_int: [ 789019, 813762, 814585, 890926, 909832 ] 
  # cik_int: [ 1018724, 1045810, 1065280, 1141391, 1273813 ] 
  # cik_int: [ 1276520, 1318605, 1326801, 1341439, 1403161, 1652044 ]     

  ## ---------- FINISHED embedding these batches. ----------------------------------------------------------------- 
  # filters:
  #   cik_int: [ 34088, 59478, 104169, 200406, 320193, 789019, 813762, 814585, 890926, 909832, 
  #               1018724, 1045810, 1065280, 1141391, 1273813, 1276520, 1318605, 1326801, 1341439, 1403161,
  #                1652044 ]     
  #   year:  [2015, 2016, 2017, 2018, 2019, 2020]             
  #   sections: null

  # also finished:
  # year:  [2021, 2022, 2023, 2024, 2025] + [2012, 2013, 2014]

  # Tesla and Microsoft for 2016 and 2017
  # cik_int: [1318605, 789019]     # (list)
  # year: [2016, 2017]             

  # Batch across 5 at a time.
  # cik_int: [ 34088, 59478, 104169, 200406, 320193 ] 
  # cik_int: [ 789019, 813762, 814585, 890926, 909832 ] 
  # cik_int: [ 1018724, 1045810, 1065280, 1141391, 1273813 ] 
  # cik_int: [ 1276520, 1318605, 1326801, 1341439, 1403161, 1652044 ]  

  # or
  # cik_int: [ 34088, 59478, 104169, 200406, 320193, 789019, 813762, 814585, 890926, 909832 ]
  # cik_int: [ 1018724, 1045810, 1065280, 1141391, 1273813, 1276520, 1318605, 1326801, 1341439, 1403161, 1652044 ]
  # -----------------------------------------------------------------------------------------------------------------

  # ---------------------------------------------------------------------------------------------------------------
  # CURRENT 25-company roster (post-expansion, 2026-07-27) -- ready for the full production run.
  # Uncomment cik_int below (and set year to the desired range) when running the real embedding job.
  # cik_int: [ 18230, 34088, 59478, 104169, 200406, 320193, 731766, 789019, 813762, 814585, 890926, 909832,
  #            1018724, 1045810, 1065280, 1133421, 1141391, 1273813, 1276520, 1283699, 1318605, 1326801,
  #            1341439, 1403161, 1652044 ]
  # ---------------------------------------------------------------------------------------------------------------

embedding_execution:
  mode: parameterized

  filters:
    # FULL PRODUCTION RUN (2026-07-27), 3 volume-balanced bins across all 25 companies:
    #   Bin 1: 2006-2016 (207,012 sentences, 33.7%) <- DONE
    #   Bin 2: 2017-2021 (224,239 sentences, 36.5%) <- ACTIVE NOW (us.cohere.embed-v4:0)
    #   Bin 3: 2022-2025 (183,536 sentences, 29.8%)
    cik_int: [ 18230, 34088, 59478, 104169, 200406, 320193, 731766, 789019, 813762, 814585, 890926, 909832,
               1018724, 1045810, 1065280, 1133421, 1141391, 1273813, 1276520, 1283699, 1318605, 1326801,
               1341439, 1403161, 1652044 ]
    year: [ 2017, 2018, 2019, 2020, 2021 ]
    sections: null

  force_replace_vectors: false
  force_replace_meta: false



  # Direct Cohere API (commented - backup option)
  # cohere:
  #   model: embed-english-v3.0
  #   api_key_env: COHERE_API_KEY
  #   dimensions: 768
  #   input_type: search_document
  #   batch_size: 96
  #   max_retries: 3
  #   timeout_seconds: 30
  


embedding:
  # NOTE: 'default_provider' selects the API TRANSPORT. Leave it at 'bedrock'
  # unless you have also read data_ml.embeddings.canonical_slot above --
  # changing it alters which vectors table embeddings_path() resolves.
  default_provider: bedrock

  # ==========================================================================
  # SPEC -- identity of the embedding space. Shared by ALL transports. PINNED.
  # ==========================================================================
  spec:
    dimensions: 1024               # POLICY: pinned. Cohere v4 silently returns
                                   # 1536-d if output_dimension is omitted.
    model_family: cohere_embed_v4  # POLICY: pinned. Titan / v3 are DIFFERENT
                                   # vector spaces, not drop-in alternatives.

    # ----------------------------------------------------------------------
    # ASYMMETRIC ENCODER -- THESE TWO MUST DIFFER. NOT A STYLE CHOICE.
    # ----------------------------------------------------------------------
    # Cohere v3/v4 are asymmetric dual encoders: ONE shared tower, with the
    # input tagged by role via input_type. The contrastive training objective
    # ONLY ever optimised
    #     cos( search_query(question) , search_document(answer) ).
    # No other role combination is trained. Using search_document on BOTH
    # sides silently converts retrieval into passage-SIMILARITY, which favours
    # definitions, table headers and cross-references over the actual figures.
    #
    #   input_type_document -> the 614,787-sentence corpus.  ALREADY CORRECT.
    #                          NEVER change this: it would invalidate every
    #                          vector already generated and force a full
    #                          re-embed.
    #   input_type_query    -> user queries AND variant queries. This is the
    #                          side that was wrong (it was borrowing the
    #                          document value from bedrock.models below).
    #
    # Both transports take the same values -- this is transport-independent,
    # which is why it lives in spec and not under bedrock:.
    # Full explanation: EMBEDDING_INPUT_TYPE_ASYMMETRY.md
    input_type_document: search_document
    input_type_query: search_query

  bedrock:
    region: us-east-1
    models:
      cohere_embed_v3: { model_id: cohere.embed-english-v3, dimensions: 1024, batch_size: 96, input_type: search_document }
      cohere_embed_v4: { model_id: cohere.embed-v4:0,      dimensions: 1024, batch_size: 96, input_type: search_document }  # reverted to on-demand 2026-07-27 -- cross-region hit the daily token cap
      titan_v2:        { model_id: amazon.titan-embed-text-v2:0, dimensions: 1024, batch_size: 25 }
    default_model: cohere_embed_v4

  # ==========================================================================
  # COHERE DIRECT TRANSPORT -- second endpoint for the SAME model/space.
  # ==========================================================================
  # Why it exists: Bedrock's Cohere Embed V4 daily cap on account
  # mjsushanth_mlops is 8,100,000 tokens/day and is NOT adjustable via API
  # (support-case only, Basic support). It blocked generation twice.
  # Cohere's own API has no daily cap. Same model, same 1024-d space, same
  # $0.12/1M tokens -- differs ONLY in quota regime.
  #
  # STATUS: config presence only. No library code reads this block yet; the
  # Bin 3 run used it via notebook 06 with hardcoded values. Wiring is
  # specified in EMBEDDING_TRANSPORT_DESIGN.md section 6.
  cohere_direct:
    model_id: embed-v4.0          # native id (Bedrock's is cohere.embed-v4:0)
    truncate: END                 # native vocabulary (Bedrock uses RIGHT)

    # Env-var NAMES exactly as they appear in .aws_secrets/aws_credentials.env
    # (gitignored). Key VALUES must never appear in this file.
    # These names are deliberately non-standard -- there is NO 'COHERE_API_KEY'
    # in this project; anything referencing that name is a bug.
    api_key_env_trial: cohere_direct_apiprod_trialk1
    api_key_env_prod: cohere_direct_apiprod_k1
    api_key_env_prod_alt: cohere_direct_apiprod_k2

    # POLICY: the trial key is FREE and rate-IDENTICAL (2,000 inputs/min) but
    # capped at 1,000 API calls/MONTH -- it CANNOT complete a bulk run (needs
    # ~2,870). Budget experiments in CALLS, not sentences: 1 call = 96
    # sentences = 0.1% of the monthly trial allowance.
    # Use 'trial' for all validation/calibration; switch to 'prod' only for a
    # real bulk run. Defaulting to trial so an accidental run cannot spend.
    use_key: trial                # trial | prod

    max_inputs_per_min: 2000      # documented; identical for trial and prod
    rate_safety_factor: 0.9       # -> max_rpm = floor(2000/96 * 0.9) = 18
    timeout_seconds: 60
    sdk_max_retries: 0            # our own retry loop owns retry; do not raise

  filtering:
    min_char_length: 30
    max_char_length: 1000
    max_token_count: 500

    # DEAD CODE -- never enforced anywhere. MLConfig.exclude_sections
    # (ml_config_loader.py:293) only reads and prints it; no filter applies it.
    # DO NOT ENFORCE IT. Doing so would be actively destructive:
    #   - ITEM_16 does not exist in the corpus at all (0 of 614,787 rows).
    #   - ITEM_15 is NOT boilerplate. Filers such as EXXON MOBIL, ORACLE and
    #     NVIDIA incorporate the financial section into Item 15 by reference,
    #     so the section parser correctly assigned their real MD&A there.
    #     Exxon: 8,212 sentences in ITEM_15 vs 663 in ITEM_7 and 546 in ITEM_8.
    #     ITEM_15 also has the HIGHEST likely_kpi rate of any section (24.9%,
    #     above ITEM_7's 24.2%); only 13.4% matches auditor/exhibit boilerplate.
    #   Excluding it would delete most of those companies' financial narrative.
    # Verified 2026-07-29 against data_cache/stage1_facts/finrag_fact_sentences.parquet.
    # See RETRIEVAL_IMPROVEMENT_STUDY.md section 2.2.
    #
    # Neutralised to [] rather than deleted: MLConfig.exclude_sections
    # (ml_config_loader.py:294) does a hard dict lookup and would raise KeyError,
    # and ml_config_loader.py:946 does ', '.join(...) on it.
    # Original value, for the record: [ITEM_15, ITEM_16]
    exclude_sections: []

      


