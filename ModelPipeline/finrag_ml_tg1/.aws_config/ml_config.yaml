  alert_threshold_pct: 80
  
  rates:
    cohere_768d: 0.0001
    cohere_1024d: 0.00012   # $0.12 / 1M tokens, Bedrock Cohere embed-v4, confirmed 2026-07-27
    bedrock_titan_1024d: 0.0001

