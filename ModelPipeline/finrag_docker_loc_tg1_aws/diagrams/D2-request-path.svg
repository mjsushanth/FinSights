<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1060" viewBox="0 0 1480 1060"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1480" height="1060" fill="#fcfcfa"/><text x="40" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#1e293b">Request path, and the namespace boundary</text><text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#64748b">How a browser reaches an answer — and why the backend has no door to the internet</text><line x1="40" y1="84" x2="1440" y2="84" stroke="#e2e8f0" stroke-width="1.5"/><rect x="963" y="59" width="11" height="11" rx="3" fill="#2563eb" fill-opacity="1.0"/><text x="980" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#64748b" fill-opacity="1.0" text-anchor="start">our code</text><rect x="1048" y="59" width="11" height="11" rx="3" fill="#0d9488" fill-opacity="1.0"/><text x="1065" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#64748b" fill-opacity="1.0" text-anchor="start">AWS managed</text><rect x="1155" y="59" width="11" height="11" rx="3" fill="#7c3aed" fill-opacity="1.0"/><text x="1172" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#64748b" fill-opacity="1.0" text-anchor="start">data plane</text><rect x="1255" y="59" width="11" height="11" rx="3" fill="#be123c" fill-opacity="1.0"/><text x="1272" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#64748b" fill-opacity="1.0" text-anchor="start">what broke</text><rect x="1355" y="59" width="11" height="11" rx="3" fill="#15803d" fill-opacity="1.0"/><text x="1372" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#64748b" fill-opacity="1.0" text-anchor="start">verified</text><rect x="40" y="104" width="1400" height="62" rx="12" fill="#ffffff" fill-opacity="1.0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="60" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e293b" fill-opacity="1.0" text-anchor="start">THE INTERNET</text><text x="60" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#64748b" fill-opacity="1.0" text-anchor="start">Anyone. Unauthenticated. This is correct — the RAG UI is the product.</text><text x="1230" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#64748b" fill-opacity="1.0" text-anchor="middle">one way in, one port</text><line x1="740" y1="166" x2="740" y2="196" stroke="#0d9488" stroke-width="2.6" marker-end="url(#ah)"/><text x="880" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#0d9488" fill-opacity="1.0" text-anchor="middle">tcp/8501 only</text><rect x="40" y="196" width="1400" height="78" rx="12" fill="#f0fdfa" fill-opacity="1.0" stroke="#0d9488" stroke-width="2"/><text x="60" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#0d9488" fill-opacity="1.0" text-anchor="start">SECURITY GROUP   finsights-app-sg</text><text x="61" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#94a3b8" fill-opacity="1.0" text-anchor="start">•</text><text x="72" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">inbound tcp/8501 from 0.0.0.0/0 — inbound on 8000: NOTHING</text><text x="880" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.3" font-weight="600" fill="#be123c" fill-opacity="1.0" text-anchor="start">Dec 2025 allowed 8000 from 0.0.0.0/0:</text><text x="880" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.3" font-weight="400" fill="#be123c" fill-opacity="1.0" text-anchor="start">the paid /query endpoint, open to the</text><text x="880" y="261" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.3" font-weight="400" fill="#be123c" fill-opacity="1.0" text-anchor="start">internet, unauthenticated and unmetered.</text><line x1="740" y1="274" x2="740" y2="302" stroke="#0d9488" stroke-width="2.6" marker-end="url(#ah)"/><rect x="40" y="302" width="1400" height="60" rx="12" fill="#ffffff" fill-opacity="1.0" stroke="#0d9488" stroke-width="2"/><text x="60" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0d9488" fill-opacity="1.0" text-anchor="start">VPC / PUBLIC SUBNET   —   route table 0.0.0.0/0 → internet gateway (free)</text><text x="60" y="350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.3" font-weight="400" fill="#64748b" fill-opacity="1.0" text-anchor="start">Public vs private is a property of the ROUTE TABLE, not the subnet. Private subnets would need a NAT gateway: ~$32.85/mo per AZ.</text><line x1="740" y1="362" x2="740" y2="392" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#ah)"/><rect x="40" y="392" width="1400" height="300" rx="14" fill="#faf5ff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="3"/><text x="62" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" fill="#7c3aed" fill-opacity="1.0" text-anchor="start">ECS TASK   —   1 vCPU / 3072 MiB / ARM64   —   networkMode awsvpc</text><text x="62" y="446" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#64748b" fill-opacity="1.0" text-anchor="start">awsvpc gives the task its own ENI and its own IP. It is also what makes “localhost” mean “this task” rather than “this host”.</text><rect x="62" y="462" width="1356" height="210" rx="12" fill="#ffffff" fill-opacity="1.0" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 5"/><text x="80" y="488" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#7c3aed" fill-opacity="1.0" text-anchor="start">ONE NETWORK NAMESPACE, SHARED BY BOTH CONTAINERS</text><text x="80" y="507" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#64748b" fill-opacity="1.0" text-anchor="start">A namespace is an enforced perception boundary. Both processes see the SAME loopback interface, so 127.0.0.1 reaches across.</text><rect x="90" y="522" width="560" height="132" rx="10" fill="#f8fafc" fill-opacity="1.0" stroke="#2563eb" stroke-width="2"/><text x="108" y="548" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2563eb" fill-opacity="1.0" text-anchor="start">frontend  —  Streamlit</text><text x="108" y="570" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.8" font-weight="500" fill="#2563eb" fill-opacity="1.0" text-anchor="start">listens 0.0.0.0:8501</text><text x="108" y="585.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.8" font-weight="500" fill="#2563eb" fill-opacity="1.0" text-anchor="start">BACKEND_URL=http://localhost:8000</text><text x="109" y="601.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#94a3b8" fill-opacity="1.0" text-anchor="start">•</text><text x="120" y="601.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">146 MiB, flat. A pure HTTP client.</text><text x="109" y="617.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#94a3b8" fill-opacity="1.0" text-anchor="start">•</text><text x="120" y="617.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">Session-affine: WebSocket + in-process state.</text><rect x="830" y="522" width="560" height="132" rx="10" fill="#f8fafc" fill-opacity="1.0" stroke="#2563eb" stroke-width="2"/><text x="848" y="548" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2563eb" fill-opacity="1.0" text-anchor="start">backend  —  FastAPI + RAG</text><text x="848" y="570" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.8" font-weight="500" fill="#2563eb" fill-opacity="1.0" text-anchor="start">listens 0.0.0.0:8000</text><text x="849" y="585.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#94a3b8" fill-opacity="1.0" text-anchor="start">•</text><text x="860" y="585.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">213 MiB idle → 1,220 MiB peak on a query.</text><text x="849" y="602.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#94a3b8" fill-opacity="1.0" text-anchor="start">•</text><text x="860" y="602.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">No ingress rule. No route from outside.</text><text x="849" y="618.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#94a3b8" fill-opacity="1.0" text-anchor="start">•</text><text x="860" y="618.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">dependsOn: frontend waits for HEALTHY.</text><line x1="650" y1="588" x2="826" y2="588" stroke="#15803d" stroke-width="3" marker-end="url(#ah)"/><text x="738" y="578" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#15803d" fill-opacity="1.0" text-anchor="middle">localhost:8000</text><text x="738" y="606" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#15803d" fill-opacity="1.0" text-anchor="middle">$0 / month</text><text x="40" y="716" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.8" font-weight="600" fill="#64748b" fill-opacity="1.0" text-anchor="start">Task role credentials arrive over the container credential endpoint at 169.254.170.2 - there are no keys in the image and none in the task definition.</text><line x1="265" y1="730" x2="265" y2="764" stroke="#0d9488" stroke-width="2.4" marker-end="url(#ah)"/><line x1="740" y1="730" x2="740" y2="764" stroke="#0d9488" stroke-width="2.4" marker-end="url(#ah)"/><line x1="1215" y1="730" x2="1215" y2="764" stroke="#0d9488" stroke-width="2.4" marker-end="url(#ah)"/><rect x="40" y="770" width="450" height="96" rx="11" fill="#f0fdfa" fill-opacity="1.0" stroke="#0d9488" stroke-width="2"/><text x="58" y="798" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0d9488" fill-opacity="1.0" text-anchor="start">Bedrock</text><text x="59" y="820" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#94a3b8" fill-opacity="1.0" text-anchor="start">•</text><text x="70" y="820" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">Haiku 4.5 via us.* inference profile, plus cohere.embed-v4.</text><text x="70" y="836.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">InvokeModel only.</text><rect x="510" y="770" width="450" height="96" rx="11" fill="#f0fdfa" fill-opacity="1.0" stroke="#0d9488" stroke-width="2"/><text x="528" y="798" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0d9488" fill-opacity="1.0" text-anchor="start">S3</text><text x="529" y="820" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#94a3b8" fill-opacity="1.0" text-anchor="start">•</text><text x="540" y="820" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">Read the corpus. Write ONLY under LOGS/FINRAG/*. No delete.</text><rect x="980" y="770" width="450" height="96" rx="11" fill="#f0fdfa" fill-opacity="1.0" stroke="#0d9488" stroke-width="2"/><text x="998" y="798" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0d9488" fill-opacity="1.0" text-anchor="start">S3 Vectors</text><text x="999" y="820" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#94a3b8" fill-opacity="1.0" text-anchor="start">•</text><text x="1010" y="820" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.8" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">QueryVectors on one index. No PutVectors, no DeleteVectors.</text><rect x="40" y="890" width="690" height="98" rx="12" fill="#ffffff" fill-opacity="1.0" stroke="#b45309" stroke-width="2"/><rect x="40" y="890" width="6" height="98" rx="3" fill="#b45309" fill-opacity="1.0"/><text x="58" y="912" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#b45309" fill-opacity="1.0" text-anchor="start">Why this is cheaper AND more capable</text><text x="58" y="931" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">Two services would let you scale them independently — but independent scaling only helps if</text><text x="58" y="948" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">something distributes load across the replicas, and DNS cannot do that: resolvers cache per TTL</text><text x="58" y="965" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">and carry no load information. So option B needs an ALB (~$16.43/mo) to deliver its own benefit.</text><text x="58" y="982" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">Co-location is free and uniquely preserves compose's depends_on ordering.</text><rect x="750" y="890" width="690" height="81" rx="12" fill="#ffffff" fill-opacity="1.0" stroke="#15803d" stroke-width="2"/><rect x="750" y="890" width="6" height="81" rx="3" fill="#15803d" fill-opacity="1.0"/><text x="768" y="912" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#15803d" fill-opacity="1.0" text-anchor="start">The line that proves the whole argument</text><text x="768" y="931" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">INFO: 127.0.0.1:34932 - "POST /query HTTP/1.1" 200 OK. The request reached the backend from the</text><text x="768" y="948" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">loopback address. No load balancer, no service discovery, no DNS, no hosted zone. That source IP</text><text x="768" y="965" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1e293b" fill-opacity="1.0" text-anchor="start">is not a detail — it is the entire cost argument, observed.</text><text x="40" y="1044" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">FinSights on AWS ECS Fargate  |  verified 2026-07-31, account 908877262866  |  source: ModelPipeline/deploy_aws/</text></svg>