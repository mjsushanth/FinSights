# ============================================================================
# FinSights DataPipeline - Lean Practical Environment
# ============================================================================
#
# Purpose: AWS + data engineering only. Supports:
#   - src_aws_etl  (historical/incremental/master merge pipeline)
#   - src_metrics  (EDGAR XBRL KPI extraction via edgartools)
#   - reading/writing the parquet assets in data_cache/
#
# Deliberately DROPPED vs the old environment.yml (2026-07-26 cleanup):
#   - great-expectations + matplotlib/seaborn/plotly/jinja2 (validation-report
#     ceremony from data_auto_stats/ - not being maintained going forward)
#   - beautifulsoup4/lxml/cssutils/nltk/sec-edgar-downloader/pyrate-limiter
#     (tied to the legacy src_legacy_bs4_scraper/ pipeline, deprioritized)
#   - joblib/pathos/multiprocess/dill/pox/ppft (parallel-processing bulk,
#     unused by src_aws_etl or src_metrics)
#   - moto/responses/pytest-cov/pytest-mock/werkzeug (heavy test-mocking
#     ceremony - kept bare pytest only)
#   - rich/pygments/colorama/tabulate/psutil/xmltodict (unused nice-to-haves)
#
# ============================================================================
#
# INSTALLATION:
#   mamba env create -f environment.yml
#   conda activate finsight-venv
#   python -c "import boto3, pandas, polars, pyarrow; print('OK')"
#
# UPDATE:
#   mamba env update -f environment.yml --prune
#
# CLEAN REINSTALL:
#   conda deactivate && conda env remove -n finsight-venv
#   mamba env create -f environment.yml
#
# ============================================================================

name: finsight-venv

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11.14
  - pip>=24.0
  - setuptools>=69.0.0
  - wheel>=0.42.0

  # Data interchange - pyarrow version matters for cross-module parquet compat
  - pyarrow>=15.0.0
  - numpy>=1.24.0,<2.0

  # Data processing
  - pandas>=2.0.0,<2.3
  - polars>=1.0.0,<2.0

  # AWS - core stack
  - boto3>=1.35.0,<1.41
  - botocore>=1.35.0,<1.41
  - s3fs>=2024.6.0
  - s3transfer>=0.14.0

  # HTTP (needed by edgartools/sec-edgar-api and boto3)
  - requests>=2.31.0
  - urllib3>=1.26.0,<2.0
  - certifi>=2024.0.0
  - charset-normalizer>=3.3.0
  - idna>=3.6

  # Config & CLI
  - python-dotenv>=1.0.0
  - pyyaml>=6.0
  - click>=8.1.0

  # Date/time
  - python-dateutil>=2.9.0
  - pytz>=2024.1

  # Progress display
  - tqdm>=4.66.0

  # Testing - bare pytest only, no mocking-framework ceremony
  - pytest>=8.0.0,<9.0

  # Notebooks - for analytics_notebooks/ (fact/incremental/dimension table
  # EDA). Minimal set: kernel + headless execution, no full JupyterLab.
  - ipykernel>=6.29.0
  - notebook>=7.0.0
  - nbconvert>=7.16.0
  - matplotlib>=3.8.0

  # System libs (conda-managed SSL)
  - openssl>=3.0
  - ca-certificates

  # ==========================================================================
  # PIP-ONLY PACKAGES
  # ==========================================================================
  - pip:
      # EDGAR XBRL access - used by src_metrics/analytical_layer.py
      - edgartools>=4.7.0
      - sec-edgar-api>=0.5.0
