<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#f8f8f6;padding:2rem;display:flex;justify-content:center}svg{width:100%;max-width:900px}</style>
</head><body>
<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="treemap-title treemap-desc">
<title id="treemap-title">44.9% of the corpus is a duplicate copy of another sentence</title>
<desc id="treemap-desc">A two-cell treemap where area encodes share of the 614,787-sentence corpus: 55.1% unique text against 44.9% exact-duplicate copies of a sentence appearing elsewhere.</desc>
<defs></defs>
<rect width="100%" height="100%" fill="#f8f8f6"/>

<rect x="40" y="40" width="504" height="380" rx="2" fill="#f8f8f6"/>
<rect x="40" y="40" width="504" height="380" rx="2" data-share="55.1" fill="rgba(45,50,58,0.16)" stroke="rgba(45,50,58,0.30)" stroke-width="1"/>
<text x="56" y="70" fill="#2d323a" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Unique text</text>
<text x="56" y="92" fill="#5a6571" font-size="11" font-family="'Geist Mono', monospace">338,869 · 55.1% of corpus</text>

<rect x="544" y="40" width="412" height="380" rx="2" fill="#f8f8f6"/>
<rect x="544" y="40" width="412" height="380" rx="2" data-share="44.9" fill="rgba(235,108,54,0.16)" stroke="#eb6c36" stroke-width="1.5"/>
<text x="560" y="70" fill="#2d323a" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Exact-duplicate copies</text>
<text x="560" y="92" fill="#eb6c36" font-size="11" font-family="'Geist Mono', monospace">275,918 · 44.9% of corpus</text>
<text x="560" y="380" fill="#828891" font-size="9" font-family="'Geist Mono', monospace">top offender: 424 occurrences, one sentence</text>

<line x1="40" y1="462" x2="960" y2="462" stroke="rgba(45,50,58,0.10)" stroke-width="0.8"/>
</svg>
</body></html>
