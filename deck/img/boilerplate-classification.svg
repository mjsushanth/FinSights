<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="boiler-title boiler-desc">
<title id="boiler-title">Three kinds of repetition, one of them actually removed</title>
<desc id="boiler-desc">A classification of repeated sentences into three categories, only one of which was removed as a genuine duplicate, the other two flagged or deliberately preserved.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>
<rect width="100%" height="100%" fill="#f8f8f6"/>

<text x="16" y="14" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CLASSIFICATION, NOT A BLANKET DEDUP</text>

<rect x="16" y="20" width="328" height="60" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
<text x="30" y="38" fill="#2d323a" font-size="10" font-weight="600" font-family="'Geist', sans-serif">A -- repeated headers</text>
<text x="30" y="52" fill="#828891" font-size="8" font-family="'Geist Mono', monospace">1,356 rows (0.22%)</text>
<text x="30" y="66" fill="#828891" font-size="8" font-family="'Geist Mono', monospace">flagged, deferred to embedding stage</text>

<rect x="16" y="88" width="328" height="60" rx="6" fill="#eb6c36" fill-opacity="0.07" stroke="#eb6c36" stroke-width="1.4"/>
<text x="30" y="106" fill="#2d323a" font-size="10" font-weight="600" font-family="'Geist', sans-serif">B -- adjacent exact repeats</text>
<text x="30" y="120" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace">123 rows -- removed</text>
<text x="30" y="134" fill="#828891" font-size="8" font-family="'Geist Mono', monospace">614,910 -&gt; 614,787, prevented at ingestion</text>

<rect x="16" y="156" width="328" height="70" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
<text x="30" y="174" fill="#2d323a" font-size="10" font-weight="600" font-family="'Geist', sans-serif">C -- same sentence, real reuse</text>
<text x="30" y="188" fill="#828891" font-size="8" font-family="'Geist Mono', monospace">85% of "duplicate" rows -- preserved</text>
<text x="30" y="202" fill="#828891" font-size="8" font-family="'Geist Mono', monospace">two distinct debt instruments, two</text>
<text x="30" y="215" fill="#828891" font-size="8" font-family="'Geist Mono', monospace">distinct lawsuits, same boilerplate</text>

<rect x="16" y="238" width="328" height="52" rx="6" fill="#5a6571" fill-opacity="0.05" stroke="#5a6571" stroke-width="1"/>
<text x="180" y="258" fill="#2d323a" font-size="9" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">"would delete real, distinctly-</text>
<text x="180" y="274" fill="#2d323a" font-size="9" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">attributable information"</text>

<text x="16" y="306" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DataPipeline/analytics/duplicate_sentence_analysis.md</text>
</svg>
