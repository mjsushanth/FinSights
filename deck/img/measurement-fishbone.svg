<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fishbone-title fishbone-desc">
<title id="fishbone-title">Four verification methods, three of which caught the tool itself lying</title>
<desc id="fishbone-desc">A fishbone diagram with false confidence from broken tooling as the observed effect, and four measurement method categories as contributing bones, three of which are annotated with a real incident where the measurement tool itself was wrong.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs>
<rect width="100%" height="100%" fill="#f8f8f6"/>

<!-- spine -->
<line x1="80" y1="280" x2="988" y2="280" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow)"/>

<!-- bone 1, above, x=680 -->
<line x1="680" y1="280" x2="584" y2="112" stroke="#2d323a" stroke-width="1"/>
<rect x="500" y="88" width="150" height="24" rx="4" fill="#ffffff" stroke="#2d323a" stroke-width="0.8"/>
<text x="575" y="104" fill="#2d323a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">External observer</text>
<line x1="648" y1="164" x2="616" y2="164" stroke="#828891" stroke-width="1"/>
<text x="612" y="160" fill="#5a6571" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">grep pattern that could never match</text>

<!-- bone 2, below, x=520 -->
<line x1="520" y1="280" x2="424" y2="448" stroke="#2d323a" stroke-width="1"/>
<rect x="340" y="436" width="170" height="24" rx="4" fill="#ffffff" stroke="#2d323a" stroke-width="0.8"/>
<text x="425" y="452" fill="#2d323a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One-time vs per-call cost</text>
<line x1="488" y1="392" x2="456" y2="392" stroke="#828891" stroke-width="1"/>
<text x="452" y="404" fill="#5a6571" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">exit code read from the wrong command</text>

<!-- bone 3, above, x=360 -->
<line x1="360" y1="280" x2="264" y2="112" stroke="#2d323a" stroke-width="1"/>
<rect x="180" y="88" width="150" height="24" rx="4" fill="#ffffff" stroke="#2d323a" stroke-width="0.8"/>
<text x="255" y="104" fill="#2d323a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Static analysis</text>

<!-- bone 4, below, x=200, FOCAL root cause -->
<line x1="200" y1="280" x2="104" y2="448" stroke="#eb6c36" stroke-width="1.4"/>
<rect x="20" y="436" width="170" height="24" rx="4" fill="#eb6c36" fill-opacity="0.07" stroke="#eb6c36" stroke-width="1.4"/>
<text x="105" y="452" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ask the cloud, not assume</text>
<line x1="168" y1="392" x2="136" y2="392" stroke="#eb6c36" stroke-width="1"/>
<text x="132" y="404" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Pricing API prefix bug -- fixed this deck's own Fargate numbers</text>

<!-- effect box -->
<rect x="988" y="250" width="180" height="60" rx="8" fill="#eb6c36" fill-opacity="0.07" stroke="#eb6c36" stroke-width="1.4"/>
<text x="1078" y="276" fill="#2d323a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">False confidence</text>
<text x="1078" y="294" fill="#2d323a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">from broken tooling</text>

<line x1="20" y1="520" x2="1170" y2="520" stroke="#2d323a" stroke-opacity="0.10" stroke-width="0.8"/>
<text x="20" y="536" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">S02h - Measurement as a Design Practice, section 8: three times my own measurement was the thing that was broken</text>
</svg>