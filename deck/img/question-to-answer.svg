<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="q2a-title q2a-desc">
<title id="q2a-title">One real question, traced to a cited answer</title>
<desc id="q2a-desc">A real curated question about Johnson and Johnson's COVID-19 disclosures is resolved by entity resolution, run through both supply lines, assembled into context from three evidence sentences across three filing years, and synthesized into a cited answer.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6571"/></marker></defs>
<rect width="100%" height="100%" fill="#f8f8f6"/>

<text x="75" y="34" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">QUESTION -- REAL, CURATED</text>
<rect x="60" y="20" width="980" height="76" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
<text x="550" y="54" fill="#2d323a" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Between 2022 and 2024, how does Johnson &amp; Johnson describe the impact of COVID-19 on selected</text>
<text x="550" y="70" fill="#2d323a" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">consumer and infectious disease product sales in its 10-K MD&amp;A discussions?</text>
<text x="550" y="84" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">a real curated question</text>

<path d="M 550,96 V 112" fill="none" stroke="#5a6571" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="60" y="112" width="300" height="64" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
<text x="210" y="136" fill="#2d323a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Entity resolution</text>
<text x="210" y="152" fill="#5a6571" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Johnson &amp; Johnson</text>
<text x="210" y="165" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CIK 200406 &#183; 2022-2024</text>

<path d="M 360,144 H 388" fill="none" stroke="#5a6571" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="390" y="112" width="300" height="64" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
<text x="540" y="136" fill="#2d323a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Two supply lines</text>
<text x="540" y="152" fill="#5a6571" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">structured KPI + semantic retrieval</text>
<text x="540" y="165" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">run in parallel</text>

<path d="M 690,144 H 718" fill="none" stroke="#5a6571" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="720" y="112" width="320" height="64" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
<text x="880" y="136" fill="#2d323a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Context assembled</text>
<text x="880" y="152" fill="#5a6571" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 evidence sentences</text>
<text x="880" y="165" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">across 3 filing years</text>

<path d="M 880,176 V 195 H 550 V 210" fill="none" stroke="#5a6571" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="60" y="210" width="980" height="150" rx="8" fill="#eb6c36" fill-opacity="0.06" stroke="#eb6c36" stroke-width="1.4"/>
<text x="75" y="228" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">CITED ANSWER</text>
<text x="550" y="252" fill="#2d323a" font-size="12" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">"Johnson &amp; Johnson initially portrays COVID-19 as a tailwind and then</text>
<text x="550" y="270" fill="#2d323a" font-size="12" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">a headwind for different parts of the portfolio."</text>
<text x="550" y="288" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">continues across 2022, 2023, 2024 -- full text in presenter notes</text>

<rect x="310" y="304" width="140" height="24" rx="12" fill="#ffffff" stroke="#828891" stroke-width="0.8"/>
<text x="380" y="320" fill="#5a6571" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10-K 2022 &#183; &#167;7</text>

<rect x="480" y="304" width="140" height="24" rx="12" fill="#ffffff" stroke="#828891" stroke-width="0.8"/>
<text x="550" y="320" fill="#5a6571" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10-K 2023 &#183; &#167;7</text>

<rect x="650" y="304" width="140" height="24" rx="12" fill="#ffffff" stroke="#828891" stroke-width="0.8"/>
<text x="720" y="320" fill="#5a6571" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10-K 2024 &#183; &#167;7</text>

<text x="550" y="346" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">difficulty: medium &#183; curation confidence 0.84</text>

<line x1="60" y1="376" x2="1040" y2="376" stroke="#2d323a" stroke-opacity="0.1" stroke-width="0.8"/>
<text x="60" y="392" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">A tailwind-then-headwind reading across three years is not keyword search, and not something an LLM can invent safely</text>
</svg>
