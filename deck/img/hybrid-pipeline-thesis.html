<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#f8f8f6;padding:2rem;display:flex;justify-content:center}svg{width:100%;max-width:420px}</style>
</head><body>
<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="thesis-title thesis-desc">
<title id="thesis-title">Two supply lines feed one answer</title>
<desc id="thesis-desc">Structured KPI extraction from parsed financial tables and semantic retrieval over sentence-level embeddings converge into a single assembled answer.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6571"/></marker></defs>
<rect width="100%" height="100%" fill="#f8f8f6"/>

<rect x="20" y="20" width="170" height="64" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
<text x="105" y="48" fill="#2d323a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Structured KPI</text>
<text x="105" y="62" fill="#2d323a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">extraction</text>
<text x="105" y="78" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">parsed financial tables</text>

<rect x="230" y="20" width="170" height="64" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
<text x="315" y="48" fill="#2d323a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Semantic</text>
<text x="315" y="62" fill="#2d323a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">retrieval</text>
<text x="315" y="78" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sentence-level embeddings</text>

<path d="M 105,84 V 140 H 160 V 196" fill="none" stroke="#5a6571" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M 315,84 V 140 H 260 V 196" fill="none" stroke="#5a6571" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="110" y="196" width="200" height="90" rx="8" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.4"/>
<text x="210" y="228" fill="#2d323a" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One answer</text>
<text x="210" y="252" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">financials + sentences +</text>
<text x="210" y="266" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">analysis + provenance</text>

<line x1="20" y1="298" x2="400" y2="298" stroke="rgba(45,50,58,0.10)" stroke-width="0.8"/>
<text x="20" y="312" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">the approach</text>
</svg>
</body></html>
