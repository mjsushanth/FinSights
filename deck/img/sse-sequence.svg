<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sse-seq-title sse-seq-desc">
<title id="sse-seq-title">A background worker bridges a synchronous pipeline into a live stream</title>
<desc id="sse-seq-desc">Sequence diagram of the browser, the FastAPI endpoint, a background worker thread, and a queue, showing how stage and token events cross from synchronous pipeline code into a server-sent event stream.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6571"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f8f8f6"/>

<!-- actors -->
<g font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d323a">
<rect x="20" y="20" width="120" height="36" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/><text x="80" y="42" text-anchor="middle">Browser</text>
<rect x="260" y="20" width="120" height="36" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/><text x="320" y="42" text-anchor="middle">FastAPI</text>
<rect x="500" y="20" width="120" height="36" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/><text x="560" y="42" text-anchor="middle">Worker thread</text>
<rect x="680" y="20" width="120" height="36" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/><text x="740" y="42" text-anchor="middle">queue.Queue</text>
</g>

<!-- lifelines -->
<g stroke="#2d323a" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3">
<line x1="80" y1="56" x2="80" y2="440"/>
<line x1="320" y1="56" x2="320" y2="440"/>
<line x1="560" y1="56" x2="560" y2="440"/>
<line x1="740" y1="56" x2="740" y2="440"/>
</g>

<!-- activation bars -->
<rect x="316" y="76" width="8" height="340" fill="#2d323a" fill-opacity="0.06" stroke="#5a6571" stroke-width="0.8"/>
<rect x="556" y="100" width="8" height="280" fill="#2d323a" fill-opacity="0.06" stroke="#5a6571" stroke-width="0.8"/>

<g font-family="'Geist Mono', monospace" font-size="9" fill="#5a6571">
<path d="M 80,76 H 320" fill="none" stroke="#5a6571" stroke-width="1" marker-end="url(#arrow)"/>
<text x="200" y="70" text-anchor="middle">POST /query/stream</text>

<path d="M 328,100 H 560" fill="none" stroke="#5a6571" stroke-width="1" marker-end="url(#arrow)"/>
<text x="440" y="94" text-anchor="middle">spawn worker thread</text>

<path d="M 560,140 H 748 V 148" fill="none" stroke="#5a6571" stroke-width="1" marker-end="url(#arrow)"/>
<text x="654" y="134" text-anchor="middle">put(stage event) x5</text>

<path d="M 560,190 H 748 V 198" fill="none" stroke="#5a6571" stroke-width="1" marker-end="url(#arrow)"/>
<text x="654" y="184" text-anchor="middle">put(token) x95</text>

<path d="M 740,230 H 332" fill="none" stroke="#5a6571" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="530" y="224" text-anchor="middle">generator drains queue</text>

<path d="M 316,254 H 84" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="200" y="248" fill="#eb6c36">data: {...}  TTFB 4.3ms</text>

<path d="M 560,320 H 748 V 328" fill="none" stroke="#5a6571" stroke-width="1" marker-end="url(#arrow)"/>
<text x="654" y="314" text-anchor="middle">put(replace, done)</text>

<path d="M 740,360 H 332" fill="none" stroke="#5a6571" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="530" y="354" text-anchor="middle">final event</text>

<path d="M 316,384 H 84" fill="none" stroke="#5a6571" stroke-width="1" marker-end="url(#arrow)"/>
<text x="200" y="378" text-anchor="middle">data: {done}, 8.96s total</text>
</g>

<line x1="16" y1="424" x2="800" y2="424" stroke="#2d323a" stroke-opacity="0.10" stroke-width="0.8"/>
<text x="16" y="438" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">TIER1_PROGRESS_LOG.md Change 4b -- verified via real Docker rebuild + browser test</text>
</svg>