<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 428 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cost-matrix-title cost-matrix-desc">
<title id="cost-matrix-title">Seven decisions under one cost constraint, scored on whether they hurt quality</title>
<desc id="cost-matrix-desc">A one-column matrix of seven architecture decisions made under a tight cost constraint, showing that five cost nothing in quality and only two -- scale to zero and no load balancer -- carried a real cost.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>
<rect width="100%" height="100%" fill="#f8f8f6"/>

<!-- header -->
<rect x="12" y="72" width="208" height="52" rx="6" fill="#ffffff" stroke="#2d323a" stroke-opacity="0.12" stroke-width="0.8"/>
<text x="116" y="96" fill="#2d323a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Decision</text>
<text x="116" y="112" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">under $17/mo cap</text>

<rect x="232" y="72" width="148" height="52" rx="6" fill="#2d323a"/>
<text x="306" y="92" fill="#ffffff" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hurt quality?</text>
<text x="306" y="108" fill="#ffffff" fill-opacity="0.85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">S02i P15</text>

<!-- rows -->
<g font-family="'Geist', sans-serif">
<!-- row 0 -->
<rect x="12" y="140" width="208" height="36" rx="4" fill="#ffffff" stroke="#2d323a" stroke-opacity="0.12" stroke-width="0.8"/>
<text x="24" y="162" fill="#2d323a" font-size="11" text-anchor="start">One task, two containers</text>
<rect x="232" y="140" width="148" height="36" rx="4" fill="#f8f8f6" stroke="#2d323a" stroke-opacity="0.12" stroke-width="0.6"/>
<text x="306" y="162" fill="#828891" font-size="10" text-anchor="middle" font-family="'Geist', sans-serif">No</text>

<!-- row 1 -->
<rect x="12" y="180" width="208" height="36" rx="4" fill="#ffffff" stroke="#2d323a" stroke-opacity="0.12" stroke-width="0.8"/>
<text x="24" y="202" fill="#2d323a" font-size="11" text-anchor="start">Public subnets (no NAT)</text>
<rect x="232" y="180" width="148" height="36" rx="4" fill="#f8f8f6" stroke="#2d323a" stroke-opacity="0.12" stroke-width="0.6"/>
<text x="306" y="202" fill="#828891" font-size="10" text-anchor="middle">No</text>

<!-- row 2 -->
<rect x="12" y="220" width="208" height="36" rx="4" fill="#ffffff" stroke="#2d323a" stroke-opacity="0.12" stroke-width="0.8"/>
<text x="24" y="242" fill="#2d323a" font-size="11" text-anchor="start">localhost over Cloud Map</text>
<rect x="232" y="220" width="148" height="36" rx="4" fill="#f8f8f6" stroke="#2d323a" stroke-opacity="0.12" stroke-width="0.6"/>
<text x="306" y="242" fill="#828891" font-size="10" text-anchor="middle">No</text>

<!-- row 3 -->
<rect x="12" y="260" width="208" height="36" rx="4" fill="#ffffff" stroke="#2d323a" stroke-opacity="0.12" stroke-width="0.8"/>
<text x="24" y="282" fill="#2d323a" font-size="11" text-anchor="start">ARM64</text>
<rect x="232" y="260" width="148" height="36" rx="4" fill="#f8f8f6" stroke="#2d323a" stroke-opacity="0.12" stroke-width="0.6"/>
<text x="306" y="282" fill="#828891" font-size="10" text-anchor="middle">No</text>

<!-- row 4 -->
<rect x="12" y="300" width="208" height="36" rx="4" fill="#ffffff" stroke="#2d323a" stroke-opacity="0.12" stroke-width="0.8"/>
<text x="24" y="322" fill="#2d323a" font-size="11" text-anchor="start">7-day log retention</text>
<rect x="232" y="300" width="148" height="36" rx="4" fill="#5a6571" fill-opacity="0.08" stroke="#2d323a" stroke-opacity="0.12" stroke-width="0.6"/>
<text x="306" y="322" fill="#5a6571" font-size="10" text-anchor="middle">Mildly</text>

<!-- row 5, focal -->
<rect x="12" y="340" width="208" height="36" rx="4" fill="#ffffff" stroke="#2d323a" stroke-opacity="0.12" stroke-width="0.8"/>
<text x="24" y="362" fill="#2d323a" font-size="11" text-anchor="start">Scale to zero by default</text>
<rect x="232" y="340" width="148" height="36" rx="4" fill="#eb6c36" fill-opacity="0.07" stroke="#eb6c36" stroke-width="1.4"/>
<text x="306" y="358" fill="#eb6c36" font-size="10" font-weight="600" text-anchor="middle">Yes</text>
<text x="306" y="370" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" opacity="0.85">cold start on every demo</text>

<!-- row 6 -->
<rect x="12" y="380" width="208" height="36" rx="4" fill="#ffffff" stroke="#2d323a" stroke-opacity="0.12" stroke-width="0.8"/>
<text x="24" y="402" fill="#2d323a" font-size="11" text-anchor="start">No load balancer</text>
<rect x="232" y="380" width="148" height="36" rx="4" fill="#2d323a" fill-opacity="0.08" stroke="#2d323a" stroke-opacity="0.12" stroke-width="0.6"/>
<text x="306" y="402" fill="#2d323a" font-size="10" text-anchor="middle">Yes</text>
</g>

<line x1="12" y1="436" x2="380" y2="436" stroke="#2d323a" stroke-opacity="0.10" stroke-width="0.8"/>
<text x="12" y="450" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">LEGEND</text>
<text x="12" y="466" fill="#828891" font-size="8" font-family="'Geist Mono', monospace">5 of 7 free or better -- only 2 rows read Yes</text>
</svg>