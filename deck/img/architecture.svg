<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1240 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="finsights-architecture-title finsights-architecture-desc">
      <title id="finsights-architecture-title">FinSights RAG pipeline, five-stage overview</title>
      <desc id="finsights-architecture-desc">A five-stage pipeline flowing from query understanding through retrieval control and context assembly to LLM synthesis, ending in the serving layer.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6571"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f8f8f6"/>

      <!-- Arrows first (z-order behind nodes) -->
      <line x1="240" y1="100" x2="280" y2="100" stroke="#5a6571" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="100" x2="520" y2="100" stroke="#5a6571" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="720" y1="100" x2="760" y2="100" stroke="#5a6571" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="960" y1="100" x2="1000" y2="100" stroke="#5a6571" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Nodes: five equal-weight pipeline stages, no focal accent -->
      <rect x="40" y="60" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
      <text x="140" y="104" fill="#2d323a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Query Understanding</text>

      <rect x="280" y="60" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
      <text x="380" y="104" fill="#2d323a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Retrieval Control</text>

      <rect x="520" y="60" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
      <text x="620" y="104" fill="#2d323a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Context Assembly</text>

      <rect x="760" y="60" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
      <text x="860" y="104" fill="#2d323a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LLM Synthesis</text>

      <rect x="1000" y="60" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
      <text x="1100" y="104" fill="#2d323a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Serving</text>
    </svg>