<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-cur-title flow-cur-desc">
<title id="flow-cur-title">Two paths, both wired to the same value</title>
<desc id="flow-cur-desc">The corpus embedding path and the query embedding path both feed into input_type search_document, even though the query needs a different value.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6571"/></marker></defs>
<rect width="100%" height="100%" fill="#f8f8f6"/>

<text x="16" y="12" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CORPUS</text>
<rect x="16" y="18" width="180" height="36" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
<text x="106" y="34" fill="#2d323a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">614,787 sentences</text>
<text x="106" y="48" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">embedding_generation.py</text>
<path d="M 196,36 H 340" fill="none" stroke="#5a6571" stroke-width="1" marker-end="url(#arrow)"/>

<text x="16" y="68" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">QUERY</text>
<rect x="16" y="74" width="180" height="36" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
<text x="106" y="90" fill="#2d323a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">user question</text>
<text x="106" y="104" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">query_embedder_v2.py:66</text>
<path d="M 196,92 H 300 V 64" fill="none" stroke="#5a6571" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="340" y="16" width="240" height="74" rx="8" fill="#5a6571" fill-opacity="0.1" stroke="#5a6571" stroke-width="1.2"/>
<text x="460" y="34" fill="#2d323a" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">input_type =</text>
<text x="460" y="52" fill="#5a6571" font-size="13" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">search_document</text>
<text x="460" y="70" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ml_config.yaml:214</text>

<rect x="610" y="30" width="130" height="44" rx="6" fill="#2d323a" fill-opacity="0.05" stroke="#2d323a" stroke-opacity="0.3" stroke-width="0.8"/>
<text x="675" y="48" fill="#5a6571" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">symmetric match</text>
<text x="675" y="64" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">"resembles", not "answers"</text>
<path d="M 580,52 H 610" fill="none" stroke="#5a6571" stroke-width="1" marker-end="url(#arrow)"/>

<line x1="16" y1="118" x2="740" y2="118" stroke="#2d323a" stroke-opacity="0.1" stroke-width="0.8"/>
<text x="16" y="132" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RETRIEVAL_IMPROVEMENT_STUDY.md 3.1 -- both paths verified reading the same config value</text>
</svg>
