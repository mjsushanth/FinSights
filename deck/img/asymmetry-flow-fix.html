<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#f8f8f6;padding:2rem;display:flex;justify-content:center}svg{width:100%;max-width:760px}</style>
</head><body>
<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-fix-title flow-fix-desc">
<title id="flow-fix-title">The correct value was already in the repository</title>
<desc id="flow-fix-desc">The query path should route to search_query, and that exact value already exists in a deprecated config block the live path never reads.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6571"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs>
<rect width="100%" height="100%" fill="#f8f8f6"/>

<text x="16" y="30" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CORPUS</text>
<rect x="16" y="44" width="180" height="52" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
<text x="106" y="66" fill="#2d323a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">614,787 sentences</text>
<text x="106" y="82" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">unchanged -- already correct</text>
<path d="M 196,70 H 300" fill="none" stroke="#5a6571" stroke-width="1" marker-end="url(#arrow)"/>

<text x="16" y="150" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">QUERY</text>
<rect x="16" y="164" width="180" height="52" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1.2"/>
<text x="106" y="186" fill="#2d323a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">user question</text>
<text x="106" y="202" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">query_embedder_v2.py:66</text>
<path d="M 196,190 H 300" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

<rect x="300" y="44" width="200" height="52" rx="6" fill="rgba(90,101,113,0.08)" stroke="#5a6571" stroke-width="1"/>
<text x="400" y="66" fill="#2d323a" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">search_document</text>
<text x="400" y="82" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">correct, unchanged</text>

<rect x="300" y="164" width="200" height="52" rx="6" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.4"/>
<text x="400" y="186" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">search_query</text>
<text x="400" y="202" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">the fix -- one config line</text>

<rect x="540" y="164" width="200" height="52" rx="6" fill="rgba(45,50,58,0.05)" stroke="rgba(45,50,58,0.30)" stroke-width="0.8" stroke-dasharray="4,3"/>
<text x="640" y="186" fill="#5a6571" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">already correct here</text>
<text x="640" y="202" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ml_config.yaml:272, deprecated block</text>
<path d="M 500,190 H 540" fill="none" stroke="#5a6571" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<line x1="16" y1="234" x2="740" y2="234" stroke="rgba(45,50,58,0.10)" stroke-width="0.8"/>
<text x="16" y="248" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">$0 to fix -- zero re-embedding, zero re-upload</text>
</svg>
</body></html>
