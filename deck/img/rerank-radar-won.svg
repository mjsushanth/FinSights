<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="radar-won-title radar-won-desc">
<title id="radar-won-title">Reranking won on cost, context size, and ROUGE-L</title>
<desc id="radar-won-desc">A radar chart showing only the three axes where cross-encoder reranking measurably beat the baseline: cost efficiency, context size, and ROUGE-L, each normalized to a 0-10 scale.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>
<rect width="100%" height="100%" fill="#f8f8f6"/>

<polygon points="320,172 347,191 336,223 304,223 293,191" fill="none" stroke="#2d323a" stroke-opacity="0.10" stroke-width="1"/>
<polygon points="320,144 373,183 353,245 287,245 267,183" fill="none" stroke="#2d323a" stroke-opacity="0.10" stroke-width="1"/>
<polygon points="320,116 400,174 369,268 271,268 240,174" fill="none" stroke="#2d323a" stroke-opacity="0.10" stroke-width="1"/>
<polygon points="320,88 427,165 386,291 254,291 213,165" fill="none" stroke="#2d323a" stroke-opacity="0.10" stroke-width="1"/>
<polygon points="320,60 453,157 402,313 238,313 187,157" fill="none" stroke="#2d323a" stroke-opacity="0.20" stroke-width="1"/>

<line x1="320" y1="200" x2="320" y2="60" stroke="#2d323a" stroke-opacity="0.20" stroke-width="1"/>
<line x1="320" y1="200" x2="453" y2="157" stroke="#2d323a" stroke-opacity="0.20" stroke-width="1"/>
<line x1="320" y1="200" x2="402" y2="313" stroke="#2d323a" stroke-opacity="0.20" stroke-width="1"/>
<line x1="320" y1="200" x2="238" y2="313" stroke="#2d323a" stroke-opacity="0.20" stroke-width="1"/>
<line x1="320" y1="200" x2="187" y2="157" stroke="#2d323a" stroke-opacity="0.20" stroke-width="1"/>

<text x="320" y="44" fill="#2d323a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">COST</text>
<text x="469" y="157" fill="#2d323a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">CONTEXT</text>
<text x="402" y="332" fill="#828891" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ROUGE-L</text>
<text x="238" y="332" fill="#828891" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">QUALITY</text>
<text x="171" y="157" fill="#828891" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">OFF-YEAR ACC</text>

<!-- only the three won axes populated, others at zero -->
<polygon points="320,60 453,157 402,313 320,200 320,200" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36" stroke-width="1.8"/>
<circle cx="320" cy="60" r="4" fill="#eb6c36"/>
<circle cx="453" cy="157" r="4" fill="#eb6c36"/>
<circle cx="402" cy="313" r="4" fill="#eb6c36"/>

<line x1="16" y1="376" x2="620" y2="376" stroke="#2d323a" stroke-opacity="0.10" stroke-width="0.8"/>
<rect x="16" y="384" width="16" height="8" fill="#eb6c36" fill-opacity="0.18" stroke="#eb6c36"/>
<text x="38" y="392" fill="#5a6571" font-size="9" font-family="'Geist Mono', monospace">reranking, top-8</text>
