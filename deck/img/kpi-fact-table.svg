<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kpi-title kpi-desc">
<title id="kpi-title">Financial facts, looked up with provenance</title>
<desc id="kpi-desc">The KPI fact table's schema grouped by identity, metric, value, and provenance columns, with a callout on why the provenance columns make restated figures distinguishable.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>
<rect width="100%" height="100%" fill="#f8f8f6"/>

<text x="16" y="14" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">KPI_FACT_DATA_EDGAR -- 13 COLUMNS</text>
<rect x="16" y="20" width="388" height="178" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>

<text x="30" y="40" fill="#828891" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.06em">IDENTITY</text>
<text x="30" y="54" fill="#2d323a" font-size="10" font-family="'Geist Mono', monospace">cik &#183; ticker &#183; year</text>

<text x="30" y="76" fill="#828891" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.06em">METRIC</text>
<text x="30" y="90" fill="#2d323a" font-size="10" font-family="'Geist Mono', monospace">metric_gaap &#183; metric_code</text>
<text x="30" y="103" fill="#2d323a" font-size="10" font-family="'Geist Mono', monospace">metric_key &#183; metric_label &#183; metric_type</text>

<text x="30" y="125" fill="#828891" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.06em">VALUE</text>
<text x="30" y="139" fill="#2d323a" font-size="10" font-family="'Geist Mono', monospace">value &#183; unit</text>

<line x1="30" y1="152" x2="390" y2="152" stroke="#2d323a" stroke-opacity="0.1" stroke-width="0.8"/>

<text x="30" y="168" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PROVENANCE</text>
<text x="30" y="182" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', monospace">form &#183; filed_date &#183; accession_no</text>

<rect x="16" y="212" width="388" height="72" rx="6" fill="#eb6c36" fill-opacity="0.06" stroke="#eb6c36" stroke-width="1.2"/>
<text x="210" y="236" fill="#2d323a" font-size="10" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Same fiscal year, filed twice --</text>
<text x="210" y="252" fill="#2d323a" font-size="10" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">the accession number keeps them apart.</text>
<text x="210" y="270" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">a number becomes a sourced number</text>

<line x1="16" y1="300" x2="404" y2="300" stroke="#2d323a" stroke-opacity="0.1" stroke-width="0.8"/>
<text x="16" y="314" fill="#828891" font-size="8" font-family="'Geist Mono', monospace">25 companies &#183; 9,260 facts &#183; 97 metric labels</text>
<text x="16" y="330" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">extracted from filing XBRL facts</text>
</svg>
