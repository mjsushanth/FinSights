<title id="latency-claim-title">Documented claim: S3 Vectors is ~90% of pipeline time</title>
<desc id="latency-claim-desc">A single bar representing the documented but unmeasured claim that S3 Vectors retrieval accounts for about 90% of pipeline latency.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>
<rect width="100%" height="100%" fill="#f8f8f6"/>
<rect x="80" y="40" width="480" height="60" rx="6" fill="#ffffff" stroke="#5a6571" stroke-width="1"/>
<rect x="80" y="40" width="432" height="60" rx="6" fill="#5a6571" fill-opacity="0.15" stroke="#5a6571" stroke-width="1"/>
<text x="296" y="120" fill="#5a6571" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">retrieve (S3 Vectors): documented ~90% of pipeline</text>
<text x="296" y="140" fill="#828891" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CLAUDE.md, prior to Tier 1 instrumentation -- never independently measured</text>
