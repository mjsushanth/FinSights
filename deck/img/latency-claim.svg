<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="latency-claim-title latency-claim-desc">
<title id="latency-claim-title">A claim, not a measurement: S3 Vectors is ~90% of pipeline time</title>
<desc id="latency-claim-desc">An outlined, dashed bar -- deliberately distinct from a measured value -- representing the documented but never-measured claim that S3 Vectors retrieval accounts for about 90% of pipeline latency.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>
<rect width="100%" height="100%" fill="#f8f8f6"/>
<rect x="80" y="8" width="140" height="16" rx="2" fill="none" stroke="#5a6571" stroke-opacity="0.40" stroke-width="0.8"/>
<text x="150" y="19" fill="#5a6571" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLAIM -- NEVER MEASURED</text>
<!-- ghosted: no fill, dashed stroke, so it cannot be mistaken for a measured bar -->
<rect x="80" y="40" width="432" height="60" rx="6" fill="#5a6571" fill-opacity="0.02" stroke="#5a6571" stroke-width="1" stroke-dasharray="4,3"/>
<text x="296" y="72" fill="#5a6571" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">retrieve (S3 Vectors)</text>
<text x="296" y="90" fill="#5a6571" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">"documented ~90% of pipeline"</text>
<text x="296" y="140" fill="#828891" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CLAUDE.md, prior to Tier 1 instrumentation -- no measurement behind this bar's length</text>
</svg>