<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="score-title score-desc">
<title id="score-title">A weighted multi-objective selection score, not a manual pick</title>
<desc id="score-desc">The quality-score formula and its five hard admission gates that decide which companies enter the corpus, with the source's own line that these filters determine who is in the dataset, not what gets sampled.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>
<rect width="100%" height="100%" fill="#f8f8f6"/>

<text x="16" y="14" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">WEIGHTED SELECTION SCORE</text>
<rect x="16" y="20" width="388" height="76" rx="6" fill="#ffffff" stroke="#2d323a" stroke-width="1"/>
<text x="210" y="40" fill="#2d323a" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">quality_score =</text>
<text x="210" y="56" fill="#5a6571" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(filing_years &#215; 5) + (section_coverage &#215; 10)</text>
<text x="210" y="70" fill="#5a6571" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ (recent_sentences / 100)</text>
<text x="210" y="84" fill="#5a6571" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ (priority_section_sentences / 50)</text>

<text x="16" y="116" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">ADMISSION GATES -- ALL MUST PASS</text>

<text x="16" y="136" fill="#2d323a" font-size="9" font-weight="600" font-family="'Geist Mono', monospace">filing_years &#8805; 5</text>
<text x="130" y="136" fill="#5a6571" font-size="9" font-family="'Geist', sans-serif">temporal consistency</text>

<text x="16" y="158" fill="#2d323a" font-size="9" font-weight="600" font-family="'Geist Mono', monospace">section_coverage &#8805; 16</text>
<text x="160" y="158" fill="#5a6571" font-size="9" font-family="'Geist', sans-serif">disclosure comprehensiveness</text>

<text x="16" y="180" fill="#2d323a" font-size="9" font-weight="600" font-family="'Geist Mono', monospace">total_sentences &#8805; 8000</text>
<text x="166" y="180" fill="#5a6571" font-size="9" font-family="'Geist', sans-serif">content volume</text>

<text x="16" y="202" fill="#2d323a" font-size="9" font-weight="600" font-family="'Geist Mono', monospace">latest_filing_year &#8805; 2018</text>
<text x="176" y="202" fill="#5a6571" font-size="9" font-family="'Geist', sans-serif">recency relevance</text>

<text x="16" y="224" fill="#2d323a" font-size="9" font-weight="600" font-family="'Geist Mono', monospace">priority_section_sentences &#8805; 3000</text>
<text x="16" y="238" fill="#5a6571" font-size="9" font-family="'Geist', sans-serif">information density</text>

<line x1="16" y1="256" x2="404" y2="256" stroke="#2d323a" stroke-opacity="0.1" stroke-width="0.8"/>

<rect x="16" y="266" width="388" height="52" rx="6" fill="#eb6c36" fill-opacity="0.06" stroke="#eb6c36" stroke-width="1.2"/>
<text x="210" y="286" fill="#2d323a" font-size="10" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">"These filters determine WHO is in the</text>
<text x="210" y="302" fill="#2d323a" font-size="10" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">dataset, not WHAT gets sampled."</text>

<text x="16" y="332" fill="#828891" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DuckDB_Sampling_Strategy.md</text>
</svg>
